<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog project</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">  
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body>
        <h1 class="text-center mb-4">Blog management</h1>

        <div class="container">
            <div class="form">
                <h3>Details of new blog</h3>
                <input id="title" class="taskiips" placeholder="Title">
                <textarea id="body" class="taskiips" placeholder="Body"></textarea>
                <input id="author" class="taskiips" placeholder="Author (optional)">
                <button class="btn btn-primary mb-4" onclick="createBlog()">Create</button>
            </div>
            
            <h2>All Blogs</h2>

            <div id="blogs"></div>

            <div class="modal fade" id="updateModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Update Blog</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div> 

                        <div class="modal-body">
                            <input id="updateTitle" class="form-control mb-2" placeholder="Title">
                            <textarea id="updateBody" class="form-control mb-2" placeholder="Body"></textarea>
                            <input id="updateAuthor" class="form-control" placeholder="Author">
                        </div>

                        <div class="modal-footer">
                            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button class="btn btn-primary" onclick="submitUpdate()">Update</button>
                        </div>

                    </div>

                </div>
            </div>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script/script.js"></script>
    </body>
</html>
